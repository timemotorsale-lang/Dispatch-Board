name: CI

on:
  push:
    branches:
      - main
      - general-overall-refinement
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NODE_OPTIONS: --max-old-space-size=4096
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/dispatch_board_test?schema=public
  CRON_SECRET: ci-build-placeholder

jobs:
  storage-guardrails:
    name: Deployment storage safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s deploy/docker/tests -p 'test_*.py' -v

  security:
    name: Dependency Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: dispatch_board_test
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d dispatch_board_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:migrate:deploy

      - name: Test
        run: npm test

      - name: Purchase import undo database proof
        run: RUN_DATABASE_INTEGRATION=1 npx vitest run src/tests/integration/purchase-import-undo.test.ts

      - name: Production scanner detection proof
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav poppler-utils
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          RUN_SCANNER_INTEGRATION=1 IMPORT_MALWARE_SCANNER_PATH=/usr/bin/clamscan npx vitest run src/tests/integration/purchase-scanner.test.ts

      - name: Scanned purchase PDF OCR proof
        run: RUN_OCR_INTEGRATION=1 DOCUMENT_TEXT_PDF_RENDERER_PATH=/usr/bin/pdftoppm npx vitest run src/tests/integration/purchase-ocr.test.ts

  labor-browser:
    name: Labor catalog browser fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:labor-pilot-ui
      - run: npm run test:light-duty-catalog-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labor-browser-fixture-${{ github.sha }}
          path: test-results/labor-pilot-ui/
          if-no-files-found: warn

  dealership-review:
    name: Private dealership preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/dealership run test
      - run: npm --prefix apps/dealership run typecheck
      - run: npm --prefix apps/dealership run build
        env:
          NEXT_PUBLIC_REVIEW_BASE_PATH: /website-review
          DEALERSHIP_ENVIRONMENT: private-review
          DEALERSHIP_HOSTED_REVIEW: "1"
      - name: Build isolated hosted preview image
        run: docker build -f deploy/docker/Dockerfile --target website-review-runner --build-arg RELEASE_SHA="${{ github.sha }}" -t tms-website-review-ci .
      - name: Validate private preview Compose configuration
        run: docker compose --profile website-review -f deploy/docker/compose.yaml -f deploy/docker/compose.tailscale.yaml config --quiet
        env:
          POSTGRES_DB: fixture
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          DEALERSHIP_REVIEW_KEY: ci-synthetic-review-key-not-production-123456789
          DEALERSHIP_REVIEW_ORIGIN: https://staff.example.test
      - name: Verify hosted preview isolation
        run: |
          set -euo pipefail
          docker run -d --name website-review-ci --network none -e DEALERSHIP_ENVIRONMENT=private-review -e DEALERSHIP_HOSTED_REVIEW=1 -e DEALERSHIP_PREVIEW_DATA=1 -e DEALERSHIP_REVIEW_KEY=ci-synthetic-review-key-not-production-123456789 -e DEALERSHIP_REVIEW_ORIGIN=https://staff.example.test tms-website-review-ci
          for attempt in {1..60}; do
            if docker exec website-review-ci node -e "fetch('http://127.0.0.1:3100/website-review/api/preview-status',{headers:{'x-tms-review-key':process.env.DEALERSHIP_REVIEW_KEY}}).then(async r=>{const data=await r.json();if(!r.ok||data.revision!==process.env.APP_RELEASE_SHA)process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs website-review-ci
              exit 1
            fi
            sleep 2
          done
          docker exec website-review-ci node -e "fetch('http://127.0.0.1:3100/website-review/').then(r=>{if(r.status!==403)process.exit(1)})"
          docker rm -f website-review-ci
      - name: Verify sample-free public website package
        run: |
          docker build -f deploy/docker/Dockerfile --target website-production-runner --build-arg RELEASE_SHA="${{ github.sha }}" -t tms-website-public-ci .
          docker run --rm --network none --entrypoint node tms-website-public-ci -e "const fs=require('fs');for(const path of ['fixtures','public/listing-media/sample-rav4.png'])if(fs.existsSync(path))throw new Error('Sample asset in public image');import('./config/sample-policy.mjs').then(({assertSamplePolicy})=>{if(assertSamplePolicy(process.env).enabled)throw new Error('Samples enabled')})"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
