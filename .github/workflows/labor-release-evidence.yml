name: Labor Release Evidence

on:
  workflow_dispatch:
    inputs:
      evidence_json:
        description: Reviewed release evidence manifest for this exact main revision
        required: true
        type: string
      artifacts_json:
        description: JSON object mapping relative file paths to reviewed text proof and operator records; never include secrets
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: labor-pilot-release-review
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Materialize reviewed evidence without executing input
        env:
          LABOR_EVIDENCE_JSON: ${{ inputs.evidence_json }}
          LABOR_ARTIFACTS_JSON: ${{ inputs.artifacts_json }}
        run: node scripts/prepare-labor-release-evidence.mjs "$RUNNER_TEMP/labor-release-evidence"
      - name: Require every release gate and exact-revision independent signoff
        run: npm run check:labor-pilot-release -- "$RUNNER_TEMP/labor-release-evidence/evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: labor-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/labor-release-evidence/
          if-no-files-found: error
          retention-days: 7
