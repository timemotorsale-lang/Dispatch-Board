# Tailscale deployment override.
#
# This publishes Next.js only on the Ubuntu host's loopback interface so
# Tailscale Serve can terminate trusted HTTPS without exposing the application
# to the LAN or public internet. Caddy remains available in the base stack for
# non-Tailscale deployments but is disabled here.

services:
  app:
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    profiles: ["public-proxy"]
